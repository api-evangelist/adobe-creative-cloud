  - name: Allocation
    description: >-
      Tag seats with department / cost-center metadata in the Admin Console;
      attribute generative-credit burn to consuming teams via Firefly
      Services audit logs.
  - name: Optimization
    description: >-
      Right-size between Single App and All Apps based on actual usage;
      reclaim seats from inactive users; reserve high-credit Firefly calls
      for final renders; use Adobe Express for lower-cost designers.
  - name: Accountability
    description: >-
      Adobe Admin Console designates a billing contact and seat administrators;
      finance reconciles monthly seat count against the renewal commitment.
