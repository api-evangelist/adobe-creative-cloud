specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Adobe Creative Cloud
providerId: adobe-creative-cloud
created: '2026-05-04'
modified: '2026-05-04'
tags:
  - AI/ML
  - Cloud
  - Creative
  - Design
  - Documents
  - Photography
  - SaaS
  - Video
  - Rate Limiting
  - Quotas
  - Throttling
description: Machine-readable rate limit definitions for the Adobe Creative Cloud API surface. Captures
  per-tier quotas, burst behavior, response signaling, and recovery semantics. Defaults are scaffold values
  to be replaced with published provider limits.
headers:
  limit: X-RateLimit-Limit
  remaining: X-RateLimit-Remaining
  reset: X-RateLimit-Reset
  retryAfter: Retry-After
  policy: RateLimit-Policy
responseCodes:
  throttled: 429
  quotaExceeded: 429
  serviceUnavailable: 503
limits:
  - tier: free
    name: Free Tier Default
    scope: api-key
    metric: requests_per_minute
    limit: 10
    burst: 20
    timeFrame: minute
    applies:
      - Adobe Firefly API
      - Adobe Express Embed SDK
      - Creative Cloud Libraries API
      - Adobe Cloud Storage and Collaboration API
      - Adobe Stock API
      - Adobe Fonts API
      - Adobe PDF Services API
      - Adobe Document Generation API
      - Acrobat Sign API
      - Adobe I/O Events
      - Adobe I/O Runtime
      - Adobe App Builder
      - Adobe UXP (Unified Extensibility Platform)
      - Adobe CEP (Common Extensibility Platform)
      - Adobe Photoshop API
      - Adobe Lightroom API
      - Adobe Developer Distribution
  - tier: free
    name: Free Tier Monthly Quota
    scope: api-key
    metric: requests_per_month
    limit: 1000
    timeFrame: month
    applies:
      - Adobe Firefly API
      - Adobe Express Embed SDK
      - Creative Cloud Libraries API
      - Adobe Cloud Storage and Collaboration API
      - Adobe Stock API
      - Adobe Fonts API
      - Adobe PDF Services API
      - Adobe Document Generation API
      - Acrobat Sign API
      - Adobe I/O Events
      - Adobe I/O Runtime
      - Adobe App Builder
      - Adobe UXP (Unified Extensibility Platform)
      - Adobe CEP (Common Extensibility Platform)
      - Adobe Photoshop API
      - Adobe Lightroom API
      - Adobe Developer Distribution
  - tier: professional
    name: Professional Tier Default
    scope: api-key
    metric: requests_per_minute
    limit: 100
    burst: 200
    timeFrame: minute
    applies:
      - Adobe Firefly API
      - Adobe Express Embed SDK
      - Creative Cloud Libraries API
      - Adobe Cloud Storage and Collaboration API
      - Adobe Stock API
      - Adobe Fonts API
      - Adobe PDF Services API
      - Adobe Document Generation API
      - Acrobat Sign API
      - Adobe I/O Events
      - Adobe I/O Runtime
      - Adobe App Builder
      - Adobe UXP (Unified Extensibility Platform)
      - Adobe CEP (Common Extensibility Platform)
      - Adobe Photoshop API
      - Adobe Lightroom API
      - Adobe Developer Distribution
  - tier: professional
    name: Professional Tier Monthly Quota
    scope: api-key
    metric: requests_per_month
    limit: 100000
    timeFrame: month
    applies:
      - Adobe Firefly API
      - Adobe Express Embed SDK
      - Creative Cloud Libraries API
      - Adobe Cloud Storage and Collaboration API
      - Adobe Stock API
      - Adobe Fonts API
      - Adobe PDF Services API
      - Adobe Document Generation API
      - Acrobat Sign API
      - Adobe I/O Events
      - Adobe I/O Runtime
      - Adobe App Builder
      - Adobe UXP (Unified Extensibility Platform)
      - Adobe CEP (Common Extensibility Platform)
      - Adobe Photoshop API
      - Adobe Lightroom API
      - Adobe Developer Distribution
  - tier: enterprise
    name: Enterprise Negotiated Limit
    scope: contract
    metric: requests_per_minute
    limit: 1000
    burst: 5000
    timeFrame: minute
    applies:
      - Adobe Firefly API
      - Adobe Express Embed SDK
      - Creative Cloud Libraries API
      - Adobe Cloud Storage and Collaboration API
      - Adobe Stock API
      - Adobe Fonts API
      - Adobe PDF Services API
      - Adobe Document Generation API
      - Acrobat Sign API
      - Adobe I/O Events
