specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Adobe Creative Cloud
providerId: adobe-creative-cloud
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Creative Cloud
notes: >-
  Creative Cloud is primarily a desktop/mobile-app subscription. Public APIs
  associated with Creative Cloud (CCWebAPI / Asset / Libraries / Storage /
  User Management) are documented separately on developer.adobe.com but do
  not publish unified per-second rate limits. Generative-credit pacing
  applies to Firefly endpoints, documented in the Firefly Services repo.
description: >-
  Adobe Creative Cloud client apps interact with Adobe IMS, Asset / Storage
  APIs, Libraries API, and (via Firefly Services) generative endpoints.
  Throttling is per-IMS-org and per-API; specific numeric ceilings are not
  published publicly and are enforced as soft caps with 429 responses.
sources:
  - https://developer.adobe.com/console/
  - https://developer.adobe.com/firefly-services/
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: User Management API
    scope: ims-org
    metric: requests_per_minute
    limit: see https://adobe-apiplatform.github.io/umapi-documentation/
    notes: >-
      User Management API enforces per-IMS-organisation throttling; bulk
      operations should use the batch endpoints.
  - name: Creative Cloud Libraries / Asset APIs
    scope: ims-org
    metric: requests_per_minute
    limit: see https://developer.adobe.com/console/
    notes: >-
      Per-organisation throttling on the Asset and Libraries endpoints.
  - name: Firefly Services generative endpoints
    scope: account
    metric: varies
    limit: see https://developer.adobe.com/firefly-services/
    notes: >-
      Generative-credit-paced; concurrent-request ceilings vary per endpoint.
policies:
  - name: Backoff Strategy
    description: Exponential backoff with jitter; honor Retry-After when present.
  - name: Generative credits
    description: >-
      Firefly endpoints decrement the generative-credit balance per call;
      depleted credits return a billing-state error rather than a 429.
  - name: IMS-org scope
    description: >-
      Limits aggregate across all credentials issued under a single Adobe
      IMS organization.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
