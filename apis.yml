    type: Documentation
  - url: https://developer.adobe.com/lightroom/lightroom-api-docs/api/
    type: APIReference
  description: >-
    A REST API for managing photos, albums, and applying presets in Adobe Lightroom, enabling automated
    photo organization and editing workflows. The API provides programmatic access to Lightroom's cloud-based
    photo library including uploading and downloading photos, creating and managing albums, applying editing
    presets, and retrieving photo metadata. Part of Adobe Firefly Services for cloud-based image processing
    automation.
