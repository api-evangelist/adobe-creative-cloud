- aid: adobe-creative-cloud:express-embed-sdk
  name: Adobe Express Embed SDK
  tags:
  - Editor
  - Embed SDK
  - JavaScript
  - Quick Actions
  - Web Components
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://developer.adobe.com/express/embed-sdk/docs/guides/
  properties:
  - url: https://developer.adobe.com/express/embed-sdk/docs/guides/
    type: Documentation
  - url: https://developer.adobe.com/express/embed-sdk/docs/guides/quickstart/
    type: GettingStarted
  - url: https://developer.adobe.com/express/embed-sdk/docs/v4/
    type: APIReference
  - url: https://github.com/AdobeDocs/cc-everywhere
    type: GitHubRepository
  description: >-
    A JavaScript SDK for embedding Adobe Express creative editing tools directly into web applications.
    The SDK provides a full editor component for design creation, quick actions for common image and video
    operations such as resize, crop, remove background, and convert formats, and template access for professional
    design starting points. Developers integrate using API keys from the Adobe Developer Console.
- aid: adobe-creative-cloud:cloud-storage-api
  name: Adobe Cloud Storage and Collaboration API
  tags:
  - Cloud Storage
  - Collaboration
  - File
  - Project
  - REST API
  tags_raw:
  - Cloud Storage
  - Collaboration
  - Files
  - Projects
  - REST API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://developer.adobe.com/cloud-storage/
  properties:
  - url: https://developer.adobe.com/cloud-storage/
    type: Documentation
  - url: https://developer.adobe.com/cloud-storage/guides/api/
    type: APIReference
  description: >-
    A REST API for managing files, folders, and projects in Adobe Creative Cloud cloud storage. The API
    supports creating and organizing projects with hierarchical folder structures, uploading and downloading
    files, assigning user roles for collaboration, and integrating cloud storage operations into automated
    creative workflows. It provides programmatic access to the same cloud storage that Creative Cloud
    desktop and mobile applications use for file synchronization.
- aid: adobe-creative-cloud:fonts-api
  name: Adobe Fonts API
  tags:
  - Fonts
  - Kits
  - Typekit
  - Typography
  - Web Fonts
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://typekit.com/api
  humanURL: https://developer.adobe.com/fonts/
  properties:
  - url: https://fonts.adobe.com/docs/api
    type: Documentation
  - url: https://github.com/typekit/fonts-api-docs
    type: GitHubRepository
  description: >-
    The Adobe Fonts API (formerly Typekit API) provides programmatic access to Adobe's font library for
    web and application integration. The API supports querying font family information and variations,
    creating and managing font kits for web deployment, generating font preview data, and retrieving font
    metadata. Kits are collections of fonts configured for specific domains and published to Adobe's CDN
    for web font delivery. Authentication uses user tokens generated via the Typekit API Token page.
- aid: adobe-creative-cloud:document-generation-api
  name: Adobe Document Generation API
  tags:
  - Data Merge
  - Document Generation
  - PDF
  - Templates
  - Word
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://pdf-services.adobe.io
  humanURL: https://developer.adobe.com/document-services/docs/overview/document-generation-api/
  properties:
  - url: https://developer.adobe.com/document-services/docs/overview/document-generation-api/
    type: Documentation
  - url: >-
      https://developer.adobe.com/document-services/docs/overview/document-generation-api/gettingstarted/
    type: GettingStarted
  description: >-
    A REST API for generating PDF and Word documents by merging JSON data into Microsoft Word templates.
    Part of Adobe Acrobat Services, the API supports conditional content insertion, dynamic table generation,
    ordered and unordered list creation, image placement, and JSONata expression evaluation within templates.
    The Adobe Document Tagger Word add-in assists with template authoring by inserting tags for data binding.
- aid: adobe-creative-cloud:acrobat-sign-api
  name: Acrobat Sign API
  tags:
  - Agreements
  - Compliance
  - Documents
  - Electronic Signatures
  - Workflows
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://developer.adobe.com/document-services/apis/sign-api/
  properties:
  - url: https://developer.adobe.com/document-services/apis/sign-api/
    type: Documentation
  - url: https://opensource.adobe.com/acrobat-sign/developer_guide/index.html
    type: APIReference
  - url: >-
      https://experienceleague.adobe.com/en/docs/acrobat-services-learn/tutorials/acrobatsign/signapi
    type: GettingStarted
  description: >-
    A REST API for creating and managing electronic signature workflows programmatically. The API supports
    document upload, agreement creation with configurable signing flows, real-time status tracking via
    webhooks, signed document retrieval, and embedded e-signature experiences within custom applications.
    Acrobat Sign is compliant with SOC 2 Type 2, ISO 27001, FedRAMP Tailored, and PCI DSS.
- aid: adobe-creative-cloud:io-events
  name: Adobe I/O Events
  tags:
  - Event-Driven
  - Event
  - Notification
  - Real-Time
  - Webhook
  tags_raw:
  - Event-Driven
  - Events
  - Notifications
  - Real-Time
  - Webhooks
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://developer.adobe.com/events/
  properties:
  - url: https://developer.adobe.com/events/docs/guides/
    type: Documentation
  - url: https://github.com/AdobeDocs/adobeio-events
    type: GitHubRepository
  - url: asyncapi/adobe-io-events-asyncapi-original.yml
    type: AsyncAPI
  description: >-
    Adobe I/O Events provides an event-driven webhook infrastructure for subscribing to changes across
    Adobe services. Developers register webhook endpoints to receive real-time HTTP POST notifications
    when events occur, such as Creative Cloud Libraries asset updates, Photoshop API job completions,
    or Experience Cloud data changes. Webhook payloads include an x-adobe-signature header for authenticity
    verification.
- aid: adobe-creative-cloud:io-runtime
  name: Adobe I/O Runtime
  tags:
  - Cloud Computing
  - Function-as-a-Service
  - Functions
  - OpenWhisk
  - Serverless
  tags_raw:
  - Cloud Computing
  - FaaS
  - Functions
  - OpenWhisk
  - Serverless
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
