    Cloud solutions.
- aid: adobe-creative-cloud:uxp
  name: Adobe UXP (Unified Extensibility Platform)
  tags:
  - Cross-App
  - Extensions
  - HTML/CSS
  - JavaScript
  - Modern
  - Plugin Framework
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://developer.adobe.com/photoshop/uxp/2022/
  properties:
  - url: https://developer.adobe.com/photoshop/uxp/2022/
    type: Documentation
  - url: https://github.com/adobe/cc-ext-uxp-types
    type: GitHubRepository
  description: >-
    The Unified Extensibility Platform (UXP) is Adobe's modern cross-app plugin development framework
    replacing the legacy CEP platform. UXP uses a JavaScript engine with support for ES6+ and provides
    a common set of platform APIs for file system access, network I/O, and UI rendering using HTML, CSS,
    and curated Spectrum design components. Plugins built with UXP run natively within Creative Cloud
    desktop applications including Photoshop, InDesign, Illustrator, Premiere Pro, and XD.
- aid: adobe-creative-cloud:cep
  name: Adobe CEP (Common Extensibility Platform)
  tags:
  - ExtendScript
  - HTML5
  - Legacy
  - Panels
  - Plugin Framework
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://adobe-cep.github.io/CEP-Resources/
  properties:
  - url: https://adobe-cep.github.io/CEP-Resources/
    type: Documentation
  - url: https://github.com/Adobe-CEP/CEP-Resources
    type: GitHubRepository
  - url: https://github.com/Adobe-CEP/Getting-Started-guides
    type: GitHubRepository
  - url: json-schema/adobe-cep-extension-manifest-schema.json
    type: JSONSchema
  description: >-
    The Common Extensibility Platform (CEP) is Adobe's legacy framework for building integrated HTML5
    panels across multiple Creative Cloud desktop applications. CEP panels use HTML5, CSS, and JavaScript
    for the UI layer and communicate with application DOMs through ExtendScript. The framework supports
    InDesign, Photoshop, Illustrator, Premiere Pro, Audition, After Effects, and other CC applications.
- aid: adobe-creative-cloud:photoshop-api
  name: Adobe Photoshop API
  tags:
  - Automation
  - Cloud
  - Firefly Services
  - Image Processing
  - Photoshop
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://image.adobe.io
  humanURL: https://developer.adobe.com/photoshop/
  properties:
  - url: https://developer.adobe.com/firefly-services/docs/photoshop/
    type: Documentation
  - url: https://developer.adobe.com/firefly-services/docs/photoshop/api/
    type: APIReference
  description: >-
    A cloud-based REST API that provides programmatic access to Photoshop's image editing capabilities
    without requiring a local installation. Part of Adobe Firefly Services, the API supports PSD document
    operations, layer editing, Smart Object replacement, text layer editing, background removal, mask
    creation, product crop, depth blur, and Photoshop Actions execution. All operations are asynchronous,
    returning a polling URL to check job status.
- aid: adobe-creative-cloud:lightroom-api
  name: Adobe Lightroom API
  tags:
  - Cloud
  - Image Editing
  - Photo Management
  - Photography
  - Presets
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://lr.adobe.io
  humanURL: https://developer.adobe.com/lightroom/
