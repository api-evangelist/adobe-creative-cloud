    type: Documentation
  - url: https://adobedocs.github.io/adobeio-runtime/
    type: Documentation
  description: >-
    A serverless computing platform built on Apache OpenWhisk that enables developers to deploy and execute
    custom code on Adobe's cloud infrastructure. I/O Runtime supports event-driven and HTTP-triggered
    function execution in JavaScript, Python, and other languages. Functions can be invoked via REST API
    or CLI and integrate natively with Adobe I/O Events for reactive workflows.
