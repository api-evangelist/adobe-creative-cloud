arazzo: 1.0.1
info:
  title: Adobe Creative Cloud Libraries Purge Element
  summary: Resolve a library, find its first element, then delete that element to purge it.
  description: >-
    A targeted cleanup flow over Creative Cloud Libraries. The workflow reads
    the target library to confirm it exists, lists its elements to capture the
    first element's identifier, and then deletes that element to purge it from
    the library. Every step spells out its request inline, including the bearer
    token and x-api-key, so the flow can be read and run without opening the
    underlying OpenAPI description.
  version: 1.0.0
sourceDescriptions:
- name: elementsApi
  url: ../openapi/adobe-creative-cloud-elements-api-openapi.yml
  type: openapi
- name: librariesApi
  url: ../openapi/adobe-creative-cloud-libraries-api-openapi.yml
  type: openapi
workflows:
- workflowId: libraries-purge-element
  summary: Confirm a library, find its first element, and delete that element.
  description: >-
    Reads the target library, lists its elements to find the first one, and
    deletes that element to purge it from the library.
  inputs:
    type: object
    required:
    - accessToken
    - apiKey
    - libraryId
    properties:
      accessToken:
        type: string
        description: OAuth 2.0 bearer access token from the Adobe IMS token endpoint.
      apiKey:
        type: string
        description: Client ID (x-api-key) from the Adobe Developer Console.
      libraryId:
        type: string
        description: Identifier of the library to purge an element from.
  steps:
  - stepId: getLibrary
    description: Read the target library to confirm it exists before purging.
    operationId: getLibrary
    parameters:
    - name: Authorization
      in: header
      value: "Bearer $inputs.accessToken"
    - name: x-api-key
      in: header
      value: $inputs.apiKey
    - name: libraryId
      in: path
      value: $inputs.libraryId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      libraryId: $response.body#/id
      elementCount: $response.body#/element_count
  - stepId: listElements
    description: >-
      List the elements in the library and capture the first element's
      identifier as the purge target.
    operationId: getElements
    parameters:
    - name: Authorization
      in: header
      value: "Bearer $inputs.accessToken"
    - name: x-api-key
      in: header
      value: $inputs.apiKey
    - name: libraryId
      in: path
      value: $steps.getLibrary.outputs.libraryId
    - name: limit
      in: query
      value: 1
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      firstElementId: $response.body#/elements/0/id
  - stepId: deleteElement
    description: Delete the first element to purge it from the library.
    operationId: deleteElement
    parameters:
    - name: Authorization
      in: header
      value: "Bearer $inputs.accessToken"
    - name: x-api-key
      in: header
      value: $inputs.apiKey
    - name: libraryId
      in: path
      value: $steps.getLibrary.outputs.libraryId
    - name: elementId
      in: path
      value: $steps.listElements.outputs.firstElementId
    successCriteria:
    - condition: $statusCode == 204
  outputs:
    libraryId: $steps.getLibrary.outputs.libraryId
    purgedElementId: $steps.listElements.outputs.firstElementId
