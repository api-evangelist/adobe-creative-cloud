specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Adobe Creative Cloud
providerId: adobe-creative-cloud
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Creative Cloud
  - Design
  - Photo
  - Video
  - Illustration
  - Generative AI
notes: >-
  Adobe Creative Cloud has tier-based subscription plans (Photography,
  Single App, All Apps) plus Teams, Business, Enterprise, and Education
  variants. Public list pricing exists at adobe.com/plans but WebFetch
  against adobe.com timed out repeatedly during reconciliation; tier
  structure is confirmed via Wikipedia (Photography, Single App, All Apps,
  All Apps + Adobe Stock) but USD list prices are not embedded here.
  Generative-credit allowances are bundled with each plan.
description: >-
  Adobe Creative Cloud is sold as a tier-based monthly or annual
  subscription. Plans differ by app coverage, included cloud storage, and
  generative-credit allowance. Teams and Enterprise SKUs add the Adobe
  Admin Console for centralized seat management.
sources:
  - https://www.adobe.com/plans
  - https://www.adobe.com/creativecloud/plans.html
  - https://en.wikipedia.org/wiki/Adobe_Creative_Cloud
plans:
  - id: adobe-creative-cloud-photography
    name: Photography
    type: subscription
    description: >-
      Lightroom + Photoshop bundle for photographers. Includes 20GB or 1TB
      cloud-storage variants.
    entries:
      - label: Photography seat
        name: photography_seat
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see https://www.adobe.com/creativecloud/plans.html
        userMultiplied: true
    elements:
      - name: Adobe Photoshop
      - name: Adobe Lightroom (and Lightroom Classic)
      - name: 20GB or 1TB cloud storage (variant-dependent)
      - name: Adobe Fonts
      - name: Adobe Portfolio
  - id: adobe-creative-cloud-single-app
    name: Single App
    type: subscription
    description: >-
      Subscription to one Creative Cloud application (e.g. Photoshop,
      Illustrator, Premiere Pro, After Effects, InDesign).
    entries:
      - label: Single-app seat
        name: single_app_seat
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see https://www.adobe.com/creativecloud/plans.html
        userMultiplied: true
    elements:
      - name: One Creative Cloud application of choice
      - name: 100GB cloud storage
      - name: Adobe Fonts
      - name: Adobe Portfolio
      - name: Generative credits (limited)
  - id: adobe-creative-cloud-all-apps
    name: All Apps
    type: subscription
    description: >-
      Full Creative Cloud suite (20+ apps) for individuals.
    entries:
      - label: All Apps seat
        name: all_apps_seat
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see https://www.adobe.com/creativecloud/plans.html
        userMultiplied: true
    elements:
      - name: All Creative Cloud applications
      - name: 100GB cloud storage
      - name: Adobe Fonts
      - name: Adobe Express Premium
      - name: Adobe Firefly generative credits
  - id: adobe-creative-cloud-teams
    name: Creative Cloud for Teams
    type: subscription
    description: >-
      Per-seat subscription with Adobe Admin Console seat management,
      centralized billing, and 1TB storage per seat.
    entries:
      - label: Teams seat
        name: teams_seat
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see https://www.adobe.com/creativecloud/business/teams/plans.html
        userMultiplied: true
    elements:
      - name: All Apps for Teams
      - name: Adobe Admin Console
      - name: 1TB cloud storage per seat
      - name: 24/7 technical support
      - name: Centralised billing
  - id: adobe-creative-cloud-enterprise
    name: Creative Cloud Enterprise
    type: enterprise
    description: >-
      Enterprise edition with custom contract pricing, single-sign-on,
      enterprise asset management, and named-user / shared-device licensing.
    entries:
      - label: Enterprise seat (negotiated)
        name: enterprise_seat
        type: subscription
        metric: seat
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: true
    elements:
      - name: All Apps Enterprise
      - name: Single sign-on
      - name: Enterprise asset libraries
      - name: Shared-device licensing (e.g. labs)
      - name: Adobe Stock integration
      - name: Premium support and TAM
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
