naftiko: 1.0.0-alpha2
info:
  label: Adobe Creative Cloud Adobe Firefly API — Image Generation
  description: 'Adobe Creative Cloud Adobe Firefly API — Image Generation. 2 operations. Lead operation: Adobe Creative Cloud
    Generate Images from Text. Self-contained Naftiko capability covering one Adobe Creative Cloud business surface.'
  tags:
  - Adobe Creative Cloud
  - Image Generation
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ADOBE_CREATIVE_CLOUD_API_KEY: ADOBE_CREATIVE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: adobe-firefly-image-generation
    baseUri: https://firefly-api.adobe.io
    description: Adobe Creative Cloud Adobe Firefly API — Image Generation business capability. Self-contained, no shared
      references.
    resources:
    - name: v3-images-generate
      path: /v3/images/generate
      operations:
      - name: generateimages
        method: POST
        description: Adobe Creative Cloud Generate Images from Text
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v3-images-generate-similar
      path: /v3/images/generate-similar
      operations:
      - name: generatesimilarimages
        method: POST
        description: Adobe Creative Cloud Generate Similar Images
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.ADOBE_CREATIVE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: adobe-firefly-image-generation-rest
    port: 8080
    description: REST adapter for Adobe Creative Cloud Adobe Firefly API — Image Generation. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v3/images/generate
      name: v3-images-generate
      description: REST surface for v3-images-generate.
      operations:
      - method: POST
        name: generateimages
        description: Adobe Creative Cloud Generate Images from Text
        call: adobe-firefly-image-generation.generateimages
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v3/images/generate-similar
      name: v3-images-generate-similar
      description: REST surface for v3-images-generate-similar.
      operations:
      - method: POST
        name: generatesimilarimages
        description: Adobe Creative Cloud Generate Similar Images
        call: adobe-firefly-image-generation.generatesimilarimages
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: adobe-firefly-image-generation-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Creative Cloud Adobe Firefly API — Image Generation. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: adobe-creative-cloud-generate-images
      description: Adobe Creative Cloud Generate Images from Text
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: adobe-firefly-image-generation.generateimages
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: adobe-creative-cloud-generate-similar
      description: Adobe Creative Cloud Generate Similar Images
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: adobe-firefly-image-generation.generatesimilarimages
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
